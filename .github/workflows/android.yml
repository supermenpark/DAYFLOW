name: DAYFLOW Android Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'dayflow/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEY_B64" | tr -d '\n\r ' | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass dayflow123

      - name: Write signing config
        run: |
          cat >> dayflow/app/build.gradle.kts <<EOF

          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("${HOME}/.android/debug.keystore")
                      storePassword = "dayflow123"
                      keyAlias = "dayflowkey"
                      keyPassword = "dayflow123"
                  }
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: dayflow
        run: gradle assembleDebug

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DAYFLOW latest
          files: dayflow/app/build/outputs/apk/debug/app-debug.apk
