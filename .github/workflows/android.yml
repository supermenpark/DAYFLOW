
name: DAYFLOW Android Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'dayflow/**'
      - '.github/workflows/android.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DAYFLOW APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project files
        working-directory: dayflow
        run: |
          echo "Checking DAYFLOW project..."
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          echo "Project files OK"

      - name: Build Debug APK
        working-directory: dayflow
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Check APK
        run: |
          test -f dayflow/app/build/outputs/apk/debug/app-debug.apk
          echo "APK BUILD SUCCESS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAYFLOW-APK
          path: dayflow/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
