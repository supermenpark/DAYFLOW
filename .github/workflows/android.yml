name: DAYFLOW Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract DAYFLOW project
        run: |
          mkdir source
          unzip -q DAYFLOW_Android_Starter_v0.1.0.zip -d source

      - name: Fix JVM target
        working-directory: source/DAYFLOW_Android_Starter
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g' app/build.gradle.kts
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle.kts
          grep -n -E "VERSION_|jvmTarget|jvmToolchain" app/build.gradle.kts || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: source/DAYFLOW_Android_Starter
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAYFLOW-APK
          path: source/DAYFLOW_Android_Starter/app/build/outputs/apk/debug/app-debug.apk