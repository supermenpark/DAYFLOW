name: DAYFLOW Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create project
        run: |
          mkdir -p dayflow/app/src/main/java/com/dayflow/app
          cd dayflow

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DAYFLOW"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.dayflow.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.dayflow.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="DAYFLOW"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dayflow/app/MainActivity.kt <<'EOF'
          package com.dayflow.app

          import android.app.Activity
          import android.content.Context
          import android.graphics.Typeface
          import android.os.Bundle
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView

          class MainActivity : Activity() {

              private val items = ArrayList<String>()
              private lateinit var adapter: ArrayAdapter<String>

              private fun save() {
                  getSharedPreferences("dayflow", Context.MODE_PRIVATE)
                      .edit()
                      .putString("tasks", items.joinToString("\n"))
                      .apply()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val saved = getSharedPreferences("dayflow", Context.MODE_PRIVATE)
                      .getString("tasks", "") ?: ""
                  if (saved.isNotEmpty()) items.addAll(saved.split("\n"))

                  val p = (16 * resources.displayMetrics.density).toInt()

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(p, p * 2, p, p)

                  val title = TextView(this)
                  title.text = "DAYFLOW"
                  title.textSize = 28f
                  title.setTypeface(null, Typeface.BOLD)
                  root.addView(title)

                  val hint = TextView(this)
                  hint.text = "탭: 완료 체크 / 길게 누르기: 삭제"
                  hint.textSize = 13f
                  root.addView(hint)

                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL

                  val input = EditText(this)
                  input.hint = "오늘 할 일"
                  input.setSingleLine(true)
                  row.addView(
                      input,
                      LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  )

                  val addButton = Button(this)
                  addButton.text = "추가"
                  row.addView(addButton)
                  root.addView(row)

                  val list = ListView(this)
                  adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, items)
                  list.adapter = adapter
                  root.addView(
                      list,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.MATCH_PARENT
                      )
                  )

                  addButton.setOnClickListener {
                      val t = input.text.